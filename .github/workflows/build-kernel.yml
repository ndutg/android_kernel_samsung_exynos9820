name: build

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  OUTDIR: out
  TZ: UTC
  DEFCONFIG: exynos9820-d2sdefconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libc6-dev libelf-dev libncurses-dev libssl-dev \
            pahole rsync unzip xz-utils zip zstd \
            clang lld llvm llvm-dev llvm-runtime \
            python3 python3-pip

      - name: Show source info
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Top level:"
          ls -la
          echo
          echo "arm64 configs:"
          ls -la arch/arm64/configs | grep exynos9820 || true
          echo
          echo "Using DEFCONFIG=${DEFCONFIG}"

      - name: Build kernel
        run: |
          mkdir -p "${OUTDIR}"

          export PATH="/usr/lib/llvm-14/bin:/usr/lib/llvm-15/bin:/usr/lib/llvm-16/bin:$PATH"
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make O="${OUTDIR}" ARCH="${ARCH}" "${DEFCONFIG}"
          make -j"$(nproc --all)" \
            O="${OUTDIR}" \
            ARCH="${ARCH}" \
            CC="${CC}" \
            LD="${LD}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_COMPAT="${CROSS_COMPILE_COMPAT}"

      - name: Collect outputs
        run: |
          mkdir -p artifacts
          find "${OUTDIR}/arch/arm64/boot" -maxdepth 1 -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" -o -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp -v {} artifacts/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: artifacts/
