name: Build Note10+ KernelSU Next + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUTDIR: out
      TZ: UTC
      KERNEL_REPO: ndutg/android_kernel_samsung_exynos9820
      KERNELBRANCH: lineage-23.2
      KSUNEXT_REPO: rifsxd/KernelSU-Next
      KSUNEXTREF: main
      SUSFSREPO: "https://github.com/Star-Seven/susfs4ksu.git"
      SUSFSREF: main

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNELBRANCH }}
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libc6-dev libelf-dev libncurses-dev libssl-dev \
            pahole rsync unzip xz-utils zip zstd \
            clang lld llvm llvm-dev llvm-runtime \
            python3 python3-pip patch

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Show source info
        run: |
          set -euxo pipefail
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo
          echo "Detected exynos9820 configs:"
          ls -1 arch/arm64/configs | grep exynos9820 || true
          echo
          echo "Using fixed defconfig: exynos9820-d2sdefconfig"
          ls -l arch/arm64/configs/exynos9820-d2sdefconfig

      - name: Integrate KernelSU Next
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "${KSUNEXTREF}" "https://github.com/${KSUNEXT_REPO}.git" kernelsu-next

          if [ -f kernelsu-next/kernel/setup.sh ]; then
            bash kernelsu-next/kernel/setup.sh
          elif [ -f kernelsu-next/kernel/setup-kernel.sh ]; then
            bash kernelsu-next/kernel/setup-kernel.sh
          else
            echo "::error::KernelSU Next setup script not found"
            find kernelsu-next -maxdepth 3 -type f | sort | tee artifacts/ksunext-files.txt
            exit 1
          fi

          find KernelSU -maxdepth 3 -type f 2>/dev/null | sort | tee artifacts/kernelsu-tree.txt || true

      - name: Clone SUSFS
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "${SUSFSREF}" "${SUSFSREPO}" susfs4ksu
          find susfs4ksu -maxdepth 3 -type f | sort | tee artifacts/susfs-files.txt

      - name: Apply SUSFS patches
        run: |
          set -euxo pipefail

          PATCH_CANDIDATES="$(find susfs4ksu -type f \( -name '*.patch' -o -name '*.diff' \) | sort || true)"
          printf '%s\n' "${PATCH_CANDIDATES}" | tee artifacts/susfs-patch-list.txt

          if [ -z "${PATCH_CANDIDATES}" ]; then
            echo "::error::No SUSFS patch files found"
            exit 1
          fi

          APPLIED=0
          while IFS= read -r patchfile; do
            [ -n "${patchfile}" ] || continue
            echo "Trying patch: ${patchfile}" | tee -a artifacts/susfs-apply.log
            if patch -p1 --forward --dry-run < "${patchfile}" >> artifacts/susfs-apply.log 2>&1; then
              patch -p1 --forward < "${patchfile}" >> artifacts/susfs-apply.log 2>&1
              echo "Applied: ${patchfile}" | tee -a artifacts/susfs-apply.log
              APPLIED=1
              break
            fi
          done <<< "${PATCH_CANDIDATES}"

          if [ "${APPLIED}" -ne 1 ]; then
            echo "::error::No SUSFS patch could be applied cleanly"
            find . -type f \( -name '*.rej' -o -name '*.orig' \) | tee artifacts/reject-files.txt || true
            exit 1
          fi

      - name: Configure kernel
        run: |
          set -euxo pipefail
          mkdir -p "${OUTDIR}"

          export PATH="/usr/lib/llvm-14/bin:/usr/lib/llvm-15/bin:/usr/lib/llvm-16/bin:${PATH}"
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make O="${OUTDIR}" ARCH="${ARCH}" exynos9820-d2sdefconfig
          cp -f "${OUTDIR}/.config" artifacts/kernel.config

      - name: Build kernel
        run: |
          set -euxo pipefail

          export PATH="/usr/lib/llvm-14/bin:/usr/lib/llvm-15/bin:/usr/lib/llvm-16/bin:${PATH}"
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          set +e
          make -j"$(nproc --all)" \
            O="${OUTDIR}" \
            ARCH="${ARCH}" \
            CC="${CC}" \
            LD="${LD}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_COMPAT="${CROSS_COMPILE_COMPAT}" \
            2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          cp -f build.log artifacts/ || true
          exit "${BUILD_RC}"

      - name: Collect outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts

          cp -f build.log artifacts/ 2>/dev/null || true
          cp -f "${OUTDIR}/.config" artifacts/ 2>/dev/null || true
          cp -f "${OUTDIR}/vmlinux" artifacts/ 2>/dev/null || true
          cp -f System.map artifacts/ 2>/dev/null || true
          cp -f "${OUTDIR}/System.map" artifacts/ 2>/dev/null || true

          find "${OUTDIR}/arch/arm64/boot" -maxdepth 2 -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp -vf {} artifacts/ \; 2>/dev/null || true

          find . -type f \( -name '*.rej' -o -name '*.orig' \) \
            -exec cp -vf {} artifacts/ \; 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10plus-ksunext-susfs
          path: artifacts
          if-no-files-found: warn
